"""A remittance batch paid to the supplier. Every field is CONFIDENTIAL (supplier financial data)."""
type AccountReceivablesSummary {
  """Remittance batch identifier as it appears on the supplier's remittance advice."""
  remittanceNumber: String!
  """Issue date of the remittance, at midnight UTC (RFC 3339)."""
  issueDate: DateTime!
  """Payment instrument family; no instrument identifiers are published."""
  paymentMethod: RemittancePaymentMethod!
  """ISO 4217 alpha-3; scopes every monetary amount on this row."""
  currency: CurrencyCode!
  """Remittance total paid to the supplier."""
  totalAmount: Decimal!
  """Early payout discount withheld from the remittance total, stated as a negative amount; 0 when no discount was withheld."""
  earlyPayoutDiscountAmount: Decimal!
}

type AccountReceivablesSummaryConnection {
  """Page of remittance batches matching the filter. Empty array is a successful empty result."""
  nodes: [AccountReceivablesSummary!]!
  """Cursor-connection page metadata for forward paging."""
  pageInfo: PageInfo!
}

"""Typed filter for remittance summary list operations. Fields combine with AND."""
input AccountReceivablesSummaryFilterInput {
  """Remittance issue-date window: from inclusive, to exclusive, UTC RFC 3339. Both bounds are required. from must be on or after the 2024-01-01 UTC data-availability floor."""
  issueDate: DateTimeIntervalInput!
}

"""Closed sort-field set for remittance summary."""
enum AccountReceivablesSummarySortFieldInput {
  """Remittance issue date (issueDate)."""
  ISSUE_DATE
}

"""Standard sort shape for remittance summary."""
input AccountReceivablesSummarySortInput {
  """Sort field. Only ISSUE_DATE is supported."""
  field: AccountReceivablesSummarySortFieldInput!
  """Sort direction."""
  direction: SortDirectionInput!
}

"""An allowance applied to a line."""
type Allowance {
  """Allowance amount applied to the line (typically negative). JSON string on output."""
  amount: Decimal!
  """Allowance category."""
  type: AccountReceivablesAllowanceType!
  """Rate expressed in percent, e.g. 3.00 = 3%; null when the allowance carries no rate."""
  ratePercent: Decimal
}

"""A chargeback against the supplier account. eventType is CHARGEBACK."""
type ChargebackLine {
  """Remittance batch the line was paid on. Join key from accountReceivablesSummary."""
