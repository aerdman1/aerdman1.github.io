"""A page of remittance lines. An empty nodes list is a successful empty result."""
type AccountReceivablesDetailsConnection {
  """Page of remittance lines matching the filter. Empty array is a successful empty result."""
  nodes: [AccountReceivablesLine!]!
  """Cursor-connection page metadata for forward paging."""
  pageInfo: PageInfo!
}

"""Typed filter for remittance line detail. Fields combine with AND."""
input AccountReceivablesDetailsFilterInput {
  """Remittance batches to read lines from: 1–100 values. More than 100 is rejected with FILTER_CARDINALITY_EXCEEDED. At least one of remittanceNumbers or eventDate is required; a request supplying neither is rejected with MISSING_REQUIRED_FILTER."""
  remittanceNumbers: [String!]
  """Line event-date window: from inclusive, to exclusive, UTC RFC 3339. At least one of remittanceNumbers or eventDate is required; when remittanceNumbers is omitted the window is applied across every remittance the supplier owns."""
  eventDate: DateTimeIntervalInput
  """Optional equality filter on the line kind. INVOICE selects every invoiced line regardless of order type."""
  eventType: AccountReceivablesEventTypeInput
  """Optional equality filter on the order type the line was raised against."""
  orderType: AccountReceivablesOrderTypeInput
  """Optional filter on where the order was placed. Exactly one of storefront or handle is given; supplying neither or both is rejected with INVALID_FILTER_VALUE. Lines with no origin (origin: null) never match."""
  origin: CommercialOriginInput
  """Optional equality filter on the dispute lifecycle state of a deduction. Only DEDUCTION lines whose deduction record is currently in this state match; lines of other event types never do."""
  disputeOutcome: AccountReceivablesDisputeOutcomeInput
}

"""Closed sort-field set for remittance line detail."""
enum AccountReceivablesDetailsSortFieldInput {
  """Line event date (eventDate)."""
  EVENT_DATE
  """Parent remittance batch number."""
  REMITTANCE_NUMBER
}

"""Standard sort shape for remittance line detail."""
input AccountReceivablesDetailsSortInput {
  """Sort field. Default EVENT_DATE when sort is omitted."""
  field: AccountReceivablesDetailsSortFieldInput!
  """Sort direction."""
  direction: SortDirectionInput!
}

"""Dispute lifecycle states. OPENED is an open deduction with no dispute filed; IN_DISPUTE means a dispute is pending resolution; RETRIEVAL_INITIATED and RETRIEVAL_COMPLETED describe the retrieval steps; SETTLED and CANCELLED are the terminal deduction outcomes; and APPROACHING_SETTLEMENT marks a dispute nearing settlement. No transition ordering is prescribed among the retrieval states or APPROACHING_SETTLEMENT."""
enum AccountReceivablesDisputeOutcome {
  """Open deduction with no dispute filed yet."""
  OPENED
  """Dispute is pending resolution."""
  IN_DISPUTE
  """Retrieval step has started."""
  RETRIEVAL_INITIATED
  """Retrieval step has completed."""
  RETRIEVAL_COMPLETED
  """Terminal settled outcome."""
  SETTLED
  """Terminal cancelled outcome."""
  CANCELLED
  """Dispute is nearing settlement."""
  APPROACHING_SETTLEMENT
}

enum AccountReceivablesDisputeOutcomeInput {
  """Open deduction with no dispute filed yet."""
  OPENED
  """Dispute is pending resolution."""
  IN_DISPUTE
  """Retrieval step has started."""
  RETRIEVAL_INITIATED
  """Retrieval step has completed."""
  RETRIEVAL_COMPLETED
  """Terminal settled outcome."""
  SETTLED
  """Terminal cancelled outcome."""
  CANCELLED
  """Dispute is nearing settlement."""
  APPROACHING_SETTLEMENT
}

"""Line kinds, aligned with the async report. Each value has a matching AccountReceivablesLine implementation and is filterable."""
enum AccountReceivablesEventType {
  """An invoice line for shipped goods or for services, advertising, or rebates."""
  INVOICE
  """An amount withheld from the remittance."""
  DEDUCTION
  """A chargeback applied against the supplier account."""
  CHARGEBACK
  """A line that nets a balance against the remittance."""
  NETTING
}

"""The line kinds that can be filtered on — every value of AccountReceivablesEventType."""
enum AccountReceivablesEventTypeInput {
  """An invoice line for shipped goods or for services, advertising, or rebates."""
  INVOICE
  """An amount withheld from the remittance."""
  DEDUCTION
  """A chargeback applied against the supplier account."""
  CHARGEBACK
  """A line that nets a balance against the remittance."""
  NETTING
}

"""One line within a remittance batch. The concrete type tells you what kind of line it is and carries only the fields that kind populates, so a field you can select is a field that has a value and null always means "no value" rather than "not applicable to this row". Every field is CONFIDENTIAL (supplier financial data)."""
interface AccountReceivablesLine {
  """Remittance batch the line was paid on."""
  remittanceNumber: String!
  """Invoice or event identifier on the line (Partner Home Event Id). May be an empty string when the source stored none."""
  invoiceNumber: String!
  """Wayfair purchase order number on the line (Partner Home PO Number). May be an empty string when the line is not PO-backed."""
  purchaseOrderNumber: String!
  """Row kind. Mirrors the concrete type name, so a client can branch on a value instead of on __typename."""
  eventType: AccountReceivablesEventType!
  """Where the order was placed. Null when the line is not tied to an order placed somewhere (netting, services, advertising and rebate lines) or the store is not yet named by this contract."""
  origin: CommercialOrigin
  """Date the line was invoiced, at midnight UTC (RFC 3339)."""
  eventDate: DateTime!
  """Product-cost component of the line. JSON string on output."""
  productAmount: Decimal!
  """Shipping component. JSON string on output."""
  shippingAmount: Decimal!
  """Other component (fees, advertising, netting balances). JSON string on output."""
  otherAmount: Decimal!
  """Tax / VAT component. JSON string on output."""
  taxVatAmount: Decimal!
  """Negative when the line reduces the remittance total."""
  paymentAmount: Decimal!
  """Sum of allowances; 0 when the line has no allowances."""
  allowanceAmount: Decimal!
  """ISO 4217 alpha-3; scopes every monetary amount on this row."""
  currency: CurrencyCode!
  """Itemized allowances on this line. Bounded, not paged: allowances are drawn from the fixed accounts-payable catalog (AccountReceivablesAllowanceType, 15 values today) and a line is granted at most a handful of them — the observed maximum across every production line is 4, and the 99th percentile is 3. Empty when the line has no allowances."""
  allowances: [Allowance!]!
}

