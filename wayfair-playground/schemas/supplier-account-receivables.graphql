# Supplier Account Receivables API
# Rebuilt from the public reference docs at https://developer.wayfair.io/posts/docs/supplier-account-receivables-api/reference/GraphQL/v1.0.0
# Endpoint: https://api.wayfair.io/2026-09/supplier-account-receivables/graphql
# Not produced by introspection: verify against the live API before publishing.
# Corrected 2026-09-30 against the API Playground's own operations (fix_schemas.py):
#   Query.supplierPayments -> SupplierPaymentsQueries { accountReceivablesSummary, accountReceivablesDetails }

type Query {
  """Supplier remittance and receivables queries."""
  supplierPayments: SupplierPaymentsQueries
}

"""Supplier remittance and receivables queries. Reached as `query { supplierPayments { … } }`."""
type SupplierPaymentsQueries {
  """Remittance batches for a supplier. Requires the supplier-payments-external-api:read-remittances grant for the supplier. Supplier identity is the validated token's supplier claim when it carries one; otherwise the WF-Supplier-Id request header names the supplier. A header that disagrees with the token's claim is rejected with FORBIDDEN. It is never a GraphQL argument."""
  accountReceivablesSummary(
    """Narrowing criteria. Fields combine with AND."""
    filter: AccountReceivablesSummaryFilterInput!
    """Ordering. Defaults to ISSUE_DATE ASC when omitted."""
    sort: AccountReceivablesSummarySortInput
    """Forward page size. Defaults to 50, maximum 100; outside that range the request is rejected with INVALID_PAGE_SIZE."""
    first: Int
    """Forward cursor: a previous page's pageInfo.endCursor; omit on the first page. Cursors are bound to the filter, sort and page size that produced them and expire 24 hours after they are issued; a stale or foreign cursor is rejected with INVALID_PAGE_TOKEN."""
    after: String
  ): AccountReceivablesSummaryConnection!
  """Line-level detail for up to 100 remittance batches. Same grant, same supplier resolution and the same cursor rules as accountReceivablesSummary; a remittance number that belongs to another supplier simply matches nothing rather than reporting its existence."""
  accountReceivablesDetails(
    """Narrowing criteria. Fields combine with AND."""
    filter: AccountReceivablesDetailsFilterInput!
    """Ordering. Defaults to EVENT_DATE ASC when omitted."""
    sort: AccountReceivablesDetailsSortInput
    """Forward page size. Defaults to 50, maximum 100; outside that range the request is rejected with INVALID_PAGE_SIZE."""
    first: Int
    """Forward cursor: a previous page's pageInfo.endCursor; omit on the first page. Cursors are bound to the filter, sort and page size that produced them and expire 24 hours after they are issued; a stale or foreign cursor is rejected with INVALID_PAGE_TOKEN."""
    after: String
  ): AccountReceivablesDetailsConnection!
}

