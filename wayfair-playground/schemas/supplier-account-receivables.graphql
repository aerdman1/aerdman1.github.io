  invoiceNumber: String!
  """Wayfair purchase order number on the line (Partner Home PO Number). May be an empty string when the line is not PO-backed."""
  purchaseOrderNumber: String!
  """Line kind. Mirrors the concrete type so clients can branch on a value instead of __typename."""
  eventType: AccountReceivablesEventType!
  """Where the order was placed (Partner Home Business). Null when not tied to a named storefront, external surface or fulfillment program."""
  origin: CommercialOrigin
  """Date the line was invoiced, at midnight UTC (RFC 3339). Partner Home Event Date."""
  eventDate: DateTime!
  """Product-cost component of the line. JSON string on output."""
  productAmount: Decimal!
  """Shipping component. JSON string on output."""
  shippingAmount: Decimal!
  """Other component (fees, advertising, netting balances). JSON string on output."""
  otherAmount: Decimal!
  """Tax / VAT component. JSON string on output."""
  taxVatAmount: Decimal!
  """Net effect on the remittance. Negative when the line reduces the total. Partner Home Payment Amount."""
  paymentAmount: Decimal!
  """Sum of allowances; 0 when the line has no allowances (not null)."""
  allowanceAmount: Decimal!
  """ISO 4217 alpha-3; scopes every monetary amount on this row."""
  currency: CurrencyCode!
  """Itemized allowances on this line (bounded list, not paged). Empty when the line has none."""
  allowances: [Allowance!]!
}

"""Where an order was placed. The concrete type tells you which kind of origin it is and carries only the fields that kind populates, so a field you can select is a field that has a value and null always means "no value" rather than "not applicable to this row". Three kinds exist: a Wayfair storefront (StorefrontOrigin, the only kind with a market), a partner surface outside Wayfair (ExternalSurfaceOrigin), and a fulfillment program (FulfillmentProgramOrigin). Kinds and handles may be added within a version, so clients must tolerate unknown values."""
interface CommercialOrigin {
  """Human-readable name of the origin, e.g. Wayfair Canada, The Knot, CastleGate."""
  displayName: String!
}

"""Every non-storefront origin that can be published or filtered on: the handle of an ExternalSurfaceOrigin or FulfillmentProgramOrigin. Storefronts have no handle; they are identified and filtered by market."""
enum CommercialOriginHandle {
  """External surface: eBay."""
  EBAY
  """External surface: Google Express."""
  GOOGLE_EXPRESS
  """External surface: The Knot."""
  THE_KNOT
  """External surface: Wayfair at Walmart."""
  WAYFAIR_AT_WALMART
  """External surface: Staples."""
  STAPLES
  """Fulfillment program: CastleGate."""
  CASTLEGATE
  """Fulfillment program: Multichannel."""
  MULTICHANNEL
}

"""The non-storefront origins that can be filtered on — every value of CommercialOriginHandle."""
enum CommercialOriginHandleInput {
  """External surface: eBay."""
  EBAY
  """External surface: Google Express."""
  GOOGLE_EXPRESS
  """External surface: The Knot."""
  THE_KNOT
  """External surface: Wayfair at Walmart."""
  WAYFAIR_AT_WALMART
  """External surface: Staples."""
  STAPLES
  """Fulfillment program: CastleGate."""
  CASTLEGATE
  """Fulfillment program: Multichannel."""
  MULTICHANNEL
}

"""Where an order was placed, as a filter. Exactly one field is given: storefront identifies a Wayfair-owned storefront by its market and matches lines whose origin is a StorefrontOrigin in that market; handle names one external surface or fulfillment program and matches lines whose origin is the ExternalSurfaceOrigin or FulfillmentProgramOrigin with that handle. Supplying neither or both is rejected with INVALID_FILTER_VALUE."""
input CommercialOriginInput {
  """Filter on a Wayfair-owned storefront by brand and country."""
  storefront: MarketContextInput
  """Filter on an external surface or fulfillment program by stable handle."""
  handle: CommercialOriginHandleInput
}

enum CurrencyCode {
  """Canadian dollar (ISO 4217)."""
  CAD
  """Euro (ISO 4217)."""
  EUR
  """Pound sterling (ISO 4217)."""
  GBP
  """United States dollar (ISO 4217)."""
  USD
}

scalar DateTime

"""Standard interval input; from is inclusive, to is exclusive, both UTC RFC 3339."""
input DateTimeIntervalInput {
  """Inclusive start of the window, UTC RFC 3339."""
  from: DateTime!
  """Exclusive end of the window, UTC RFC 3339. Must be strictly after from."""
  to: DateTime!
}

"""Arbitrary-precision decimal, serialised as a JSON string in plain notation so a client decoding JSON numbers as IEEE-754 doubles cannot round a monetary amount. Accepts a string or a number on input."""
scalar Decimal

"""An amount withheld from the remittance. eventType is DEDUCTION."""
type DeductionLine {
  """Remittance batch the line was paid on. Join key from accountReceivablesSummary."""
  remittanceNumber: String!
  """Invoice or event identifier on the line (Partner Home Event Id). May be an empty string when the source stored none."""
  invoiceNumber: String!
  """Wayfair purchase order number on the line (Partner Home PO Number). May be an empty string when the line is not PO-backed."""
  purchaseOrderNumber: String!
  """Line kind. Mirrors the concrete type so clients can branch on a value instead of __typename."""
  eventType: AccountReceivablesEventType!
  """Where the order was placed (Partner Home Business). Null when not tied to a named storefront, external surface or fulfillment program."""
  origin: CommercialOrigin
  """Date the line was invoiced, at midnight UTC (RFC 3339). Partner Home Event Date."""
  eventDate: DateTime!
  """Product-cost component of the line. JSON string on output."""
  productAmount: Decimal!
  """Shipping component. JSON string on output."""
  shippingAmount: Decimal!
  """Other component (fees, advertising, netting balances). JSON string on output."""
  otherAmount: Decimal!
  """Tax / VAT component. JSON string on output."""
  taxVatAmount: Decimal!
  """Negative — a deduction reduces the remittance total."""
  paymentAmount: Decimal!
  """Sum of allowances; 0 when the line has no allowances (not null)."""
  allowanceAmount: Decimal!
  """ISO 4217 alpha-3; scopes every monetary amount on this row."""
  currency: CurrencyCode!
  """Itemized allowances on this line (bounded list, not paged). Empty when the line has none."""
  allowances: [Allowance!]!
  """Part number from the deduction record; present only on deduction lines."""
  partNumber: String
  """Settlement date from the deduction approver record; null until the deduction settles."""
  deductionSettlementDate: DateTime
  """Reason category derived from the deduction's credit origin; null when the deduction has no known credit origin."""
  deductionType: AccountReceivablesDeductionType
  """Short description of the deduction reason."""
  deductionDescription: String
  """Memo from the deduction record; present only on deduction lines."""
  deductionMemo: String
  """Partner Home Deduction ID."""
  creditReference: String!
  """Whether a new dispute can be raised on this line. Always false once dispute.ticket is present."""
  isDisputable: Boolean!
  """Last date a new dispute can be raised (payment date plus 61 days). Null when never eligible."""
  disputableUntil: DateTime
  """Partner Home dispute ticket and/or deduction lifecycle outcome. Null when neither is published."""
  dispute: Dispute
}

"""A line a dispute can be raised on. Implemented by invoice and deduction lines only — the other line kinds are outside the dispute window entirely, which is why they do not carry these fields at all."""
interface Disputable {
  """Whether a new dispute can be raised on this line: it is a disputable line kind and nothing has been raised on it yet. Always false once dispute.ticket is present; a deduction line may carry a dispute with only an outcome (its deduction status) and still be disputable."""
  isDisputable: Boolean!
  """Last date a new dispute can be raised: the payment date plus 61 days; null when never eligible."""
  disputableUntil: DateTime
  """The dispute raised on this line, or — on a deduction line — its deduction status as outcome; null when there is neither."""
  dispute: Dispute
}

"""A dispute raised against a line."""
type Dispute {
  """Partner Home ticket reference; null on a deduction line whose status is published without a dispute ticket."""
  ticket: String
  """Deep link to the ticket in Partner Home; null when ticket is null."""
  partnerHomeUrl: String
  """The deduction's dispute lifecycle status; present on deduction lines, with or without a dispute ticket."""
  outcome: AccountReceivablesDisputeOutcome
}

"""A sales surface outside Wayfair on which Wayfair lists the supplier's products (The Knot, eBay, Google Express, Wayfair at Walmart, Staples). These surfaces have no Wayfair market — no brand, no sales channel — so this kind carries no marketContext; do not read its absence as an unknown market. Filter with origin: { handle }."""
type ExternalSurfaceOrigin {
  """Stable identifier of the surface, e.g. EBAY, THE_KNOT, GOOGLE_EXPRESS, WAYFAIR_AT_WALMART, STAPLES."""
  handle: CommercialOriginHandle!
  """Human-readable origin label (Partner Home Business). Not a stable filter key."""
  displayName: String!
}

"""A fulfillment program rather than a place of sale (CastleGate, Multichannel). The program is already named by orderType; the origin is published so every line answers "where did this come from" the same way. A program is not a market, so this kind carries no marketContext. Filter with origin: { handle }."""
type FulfillmentProgramOrigin {
  """Stable identifier of the program, e.g. CASTLEGATE, MULTICHANNEL."""
  handle: CommercialOriginHandle!
  """Human-readable origin label (Partner Home Business). Not a stable filter key."""
  displayName: String!
}

"""An invoiced line — goods shipped against an order, or a service, advertising or rebate invoice with no goods movement of its own. eventType is INVOICE. Mirrors the async report, where the stored PRODUCT charge type is published as INVOICE."""
type InvoiceLine {
  """Remittance batch the line was paid on. Join key from accountReceivablesSummary."""
  remittanceNumber: String!
  """Invoice or event identifier on the line (Partner Home Event Id). May be an empty string when the source stored none."""
  invoiceNumber: String!
  """Wayfair purchase order number on the line (Partner Home PO Number). May be an empty string when the line is not PO-backed."""
  purchaseOrderNumber: String!
  """Line kind. Mirrors the concrete type so clients can branch on a value instead of __typename."""
  eventType: AccountReceivablesEventType!
  """The order type the line was raised against; null when the stored value is absent or is one this version does not publish."""
  orderType: AccountReceivablesOrderType
  """Where the order was placed (Partner Home Business). Null when not tied to a named storefront, external surface or fulfillment program."""
  origin: CommercialOrigin
  """Date the line was invoiced, at midnight UTC (RFC 3339). Partner Home Event Date."""
  eventDate: DateTime!
  """Product-cost component of the line. JSON string on output."""
  productAmount: Decimal!
  """Shipping component. JSON string on output."""
  shippingAmount: Decimal!
  """Other component (fees, advertising, netting balances). JSON string on output."""
  otherAmount: Decimal!
  """Tax / VAT component. JSON string on output."""
  taxVatAmount: Decimal!
  """Net effect on the remittance. Negative when the line reduces the total. Partner Home Payment Amount."""
  paymentAmount: Decimal!
  """Sum of allowances; 0 when the line has no allowances (not null)."""
  allowanceAmount: Decimal!
  """ISO 4217 alpha-3; scopes every monetary amount on this row."""
  currency: CurrencyCode!
  """Itemized allowances on this line (bounded list, not paged). Empty when the line has none."""
  allowances: [Allowance!]!
  """Whether a new dispute can be raised on this line. Always false once dispute.ticket is present."""
  isDisputable: Boolean!
  """Last date a new dispute can be raised (payment date plus 61 days). Null when never eligible."""
  disputableUntil: DateTime
  """Partner Home dispute ticket and/or deduction lifecycle outcome. Null when neither is published."""
  dispute: Dispute
}

"""The market a Wayfair storefront sells into. Shared six-dimension output shape (NAME-10); a storefront always populates country, locale, channel and segment; brand is null for a storefront NAME-10 has not assigned a brand code to yet (Wayfair Supply, DwellStudio), and location is null when the storefront is not location-scoped."""
type MarketContext {
  """ISO 3166-1 alpha-2, e.g. US, CA, GB, DE, IE."""
  country: String
  """Regional BCP 47 locale, e.g. en-US, en-CA, de-DE."""
  locale: String
  """Two-letter storefront brand code: WF (WAYFAIR), AM (ALLMODERN), BL (BIRCH_LANE), JM (JOSS_AND_MAIN), PG (PERIGOLD) — the output form of MarketContextBrandInput."""
  brand: String
  """Sales channel: ECM (e-commerce storefront) or PHR (Wayfair Professional)."""
  channel: String
  """Customer segment: B2C or B2B."""
  segment: String
  """Location within the market; null when the storefront is not location-scoped."""
  location: String
}

"""Shared brand input enum (NAME-10). Input values are full brand names; the output MarketContext.brand publishes the corresponding two-letter storefront code."""
enum MarketContextBrandInput {
  """Wayfair brand (published as WF)."""
  WAYFAIR
  """AllModern brand (published as AM)."""
  ALLMODERN
  """Joss & Main brand (published as JM)."""
  JOSS_AND_MAIN
  """Birch Lane brand (published as BL)."""
  BIRCH_LANE
  """Perigold brand (published as PG)."""
  PERIGOLD
}

"""Shared market-context input (NAME-10): the brand-plus-country subset. brand and country are both required because together they are a Wayfair storefront's identity ({ brand: WAYFAIR, country: "CA" } is Wayfair Canada). Matches every sales channel of that storefront. A brand-and-country pair no Wayfair storefront sells into is rejected with INVALID_FILTER_VALUE."""
input MarketContextInput {
  """ISO 3166-1 alpha-2 code, e.g. US, CA."""
  country: String!
  brand: MarketContextBrandInput!
}

"""A balance netted off against the remittance. eventType is NETTING."""
type NettingLine {
  """Remittance batch the line was paid on. Join key from accountReceivablesSummary."""
  remittanceNumber: String!
  """Invoice or event identifier on the line (Partner Home Event Id). May be an empty string when the source stored none."""
  invoiceNumber: String!
  """Wayfair purchase order number on the line (Partner Home PO Number). May be an empty string when the line is not PO-backed."""
  purchaseOrderNumber: String!
  """Line kind. Mirrors the concrete type so clients can branch on a value instead of __typename."""
  eventType: AccountReceivablesEventType!
  """The order type the balance was netted against — most often a service, advertising or rebate type; null when the stored value is absent or is one this version does not publish."""
  orderType: AccountReceivablesOrderType
  """Where the order was placed (Partner Home Business). Null when not tied to a named storefront, external surface or fulfillment program."""
  origin: CommercialOrigin
  """Date the line was invoiced, at midnight UTC (RFC 3339). Partner Home Event Date."""
  eventDate: DateTime!
  """Product-cost component of the line. JSON string on output."""
  productAmount: Decimal!
  """Shipping component. JSON string on output."""
  shippingAmount: Decimal!
  """Other component (fees, advertising, netting balances). JSON string on output."""
  otherAmount: Decimal!
  """Tax / VAT component. JSON string on output."""
  taxVatAmount: Decimal!
  """Net effect on the remittance. Negative when the line reduces the total. Partner Home Payment Amount."""
  paymentAmount: Decimal!
  """Sum of allowances; 0 when the line has no allowances (not null)."""
  allowanceAmount: Decimal!
  """ISO 4217 alpha-3; scopes every monetary amount on this row."""
  currency: CurrencyCode!
  """Itemized allowances on this line (bounded list, not paged). Empty when the line has none."""
  allowances: [Allowance!]!
}

"""Platform connection pageInfo for remittance list operations. Declared locally until the shared Partner Home API Platform type is published; field names and values match the shared contract."""
type PageInfo {
  """True when a further page exists after this one."""
  hasNextPage: Boolean!
  """True when this page is non-empty and was reached with after, so rows exist before its first node. An empty page reports false."""
  hasPreviousPage: Boolean!
  """Opaque cursor of this page's first node. Null only on an empty page."""
  startCursor: String
  """Opaque cursor of this page's last node; pass as after. Null only on an empty page."""
  endCursor: String
}

"""Payment instrument family a remittance was settled with. OTHER covers a remittance settled outside the named families, including one the source system records without an instrument (a reversal or a zero-amount adjustment)."""
enum RemittancePaymentMethod {
  """ACH / automated clearing house settlement."""
  ACH
  """Bank transfer (non-wire family)."""
  BANK_TRANSFER
  """Cheque settlement."""
  CHEQUE
  """Card family (no PAN published)."""
  CREDIT_CARD
  """Manual settlement."""
  MANUAL
  """Netted settlement."""
  NETTED
  """Unnamed or missing instrument (including reversals)."""
  OTHER
  """Wire transfer."""
  WIRE
}

"""Direction a list is ordered in."""
enum SortDirectionInput {
  """Ascending order (earliest / smallest first)."""
  ASC
  """Descending order (latest / largest first)."""
  DESC
}

"""A storefront Wayfair owns and operates (Wayfair, AllModern, Birch Lane, Joss & Main, Perigold, Wayfair Supply and their country editions). This is the only origin kind with a market: every Wayfair storefront sells one brand into one country over one sales channel, so marketContext is always present here and absent on every other origin kind. The market is the storefront's identity: there is no separate handle, so group or compare storefronts on marketContext.brand, marketContext.country and marketContext.channel rather than on a name, and filter with origin: { storefront: { brand, country } }."""
type StorefrontOrigin {
  """Human-readable origin label (Partner Home Business). Not a stable filter key."""
  displayName: String!
  """The market the storefront sells into: brand, country and sales channel at minimum."""
  marketContext: MarketContext!
}
