type Query {
  """Load label generation events that occurred through the API. Returns data associated with previously committed registrations (calls to the Register Mutation). The query can be used to retrieve the appropriate shipping document endpoint URLs, as well as the submitted pick-up date for the shipment and all the information for the related purchase order. After retrieving shipping label it also contains information about generated shipping labels"""
  labelGenerationEvents(
    """A list of filters to apply."""
    filters: [LabelGenerationEventFilterInput] = []
    """A list of orderings to order the result set by. The first item in the list has the highest priority and the last has the least."""
    ordering: [orderingInput] = []
    """The maximum number of results to return. If a limit is set and the result set contains more items than the limit, then a subset of the results with a count equal to limit will be returned. If no limit is set, the default is 10."""
    limit: Int = 10
    """The index of the result set to start at. If an offset is set all items at an index before the offset will be eliminated from the results."""
    offset: Int = 0
  ): [LabelGenerationEvent!]!
}

type Mutation {
  """Purchase order registration mutations."""
  purchaseOrders: PurchaseOrderMutations
}

"""Purchase order registration mutations. Reached as `mutation { purchaseOrders { … } }`."""
type PurchaseOrderMutations {
  """Register purchase order items for shipment."""
  register(
    """The input containing information necessary for registering items to ship"""
    registrationInput: RegistrationInput!
  ): LabelGenerationEvent!
}

