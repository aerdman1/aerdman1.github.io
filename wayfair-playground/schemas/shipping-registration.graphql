"""Information about a specific shipping label"""
type ShippingLabel {
  """A URL for downloading this shipping label"""
  url: URL!
}

"""Information about generated shipping label"""
type ShippingLabelInfo {
  """Purchase order number"""
  poNumber: Int32!
  """Full purchase order number"""
  fullPoNumber: String!
  """Number of labels"""
  numberOfLabels: Int32!
  """Carrier for this shipping label"""
  carrier: String!
  """Carrier code for this shipping label"""
  carrierCode: String!
  """Tracking number for this shipping label"""
  trackingNumber: String!
}

"""Interface for a Shipping Label - this contains all the common properties a label should have"""
interface ShippingLabelInterface {
  """Carrier for this shipping label"""
  carrier: String!
  """Carrier code for this shipping label"""
  carrierCode: String!
  """Tracking number for this shipping label"""
  trackingNumber: String!
}

"""A unit that is being shipped out. In this sense, a unit is a single quantity of a single product part in a single box"""
type ShippingUnit {
  """This is an identifier representing which instance of this particular part this unit belongs to. For instance, if a purchase order has a single part with a quantity of 2, the group will either be 1 or 2. If the group is 1 this shipping unit refers to the first instance of the product"""
  groupIdentifier: PositiveInt!
  """This is an identifier representing the box number in the group that this shipping unit belongs to. For instance, if a specific part only has one group, but the group is shipped in 5 boxes the sequences for the group will range from 1 to 5. Note that there can only be one of each"""
  sequenceIdentifier: PositiveInt!
  """The part that this shipping unit is associated with"""
  part: Part!
}

"""An input representing a shipping unit"""
input ShippingUnitInput {
  """The ordered product's identifier"""
  partNumber: NonEmptyString!
  """The type of shipping unit"""
  unitType: ShippingUnitType!
  """The weight of the package"""
  weight: WeightInput!
  """The length dimensions of the package"""
  dimensions: DimensionInput!
  """The shipping unit's freight class, which is broadly categorized by weight"""
  freightClass: FreightClass
  """Additional information which is required for all palletized shipments. Only provide this data if the shipment is palletized"""
  palletInfo: PalletInput
  """A numeric identifier used to associate all the shipping units related to a single instance of an item. This value should be equal for all shipping units which contain pieces of a single product. E.g., if 2 of the same product are requested with a purchase order, all the cartons containing parts of the first product should have a groupIdentifier of 1, and all cartons for the second item have a groupIdentifier of 2"""
  groupIdentifier: PositiveInt!
  """A numeric identifier used to distinguish between the shipping units related to a single item. This value should be different for all shipping units instances related to a single product. E.g., if an ordered item ships in three different cartons, there should be 3 distinct shippingUnitInputs with sequenceIdentifiers of 1, 2 and 3"""
  sequenceIdentifier: PositiveInt!
}

"""The types of packaging units that can be shipped"""
enum ShippingUnitType {
  """A carton (box) unit"""
  CARTON
  """A sealed plastic bag unit"""
  BAG
  """A rolled-up unit"""
  ROLL
  """Any shipping unit that cannot be defined as a carton, roll, or bag"""
  OTHER
}

"""A supplier entity"""
type Supplier {
  """The unique identifier for a supplier"""
  id: ID
  """The name of the supplier"""
  name: String
  """The shortened name of the supplier"""
  shortName: String
  """Status of supplier"""
  status: SupplierStatus
  """The web address of the supplier's site"""
  websiteURL: String
  """The currency id of the supplier"""
  currency: ExtranetCurrency
  """Load the scopes accessible to this supplier"""
  scopes: [Scope]
  """Load the child suppliers of this supplier"""
  warehouses: [Warehouse!]
}

"""Represents the status of the supplier"""
enum SupplierStatus {
  """Active Status"""
  ACTIVE
  """Inactive Status"""
  INACTIVE
  """Being Added Status"""
  BEING_ADDED
  """On Hold Status"""
  ON_HOLD
}

"""A URL as described by IEFT RFC 1738 ( https://tools.ietf.org/html/rfc1738)"""
scalar URL

"""Information for a supplier warehouse"""
type Warehouse {
  """The id of the warehouse"""
  id: ID
  """The name of the warehouse"""
  name: String
  """The address of the warehouse"""
  address: Address
  """The company this warehouse belongs to"""
  supplier: Supplier
}

"""A product that Wayfair has on site"""
type WayfairProduct {
  """The sku representing the product"""
  sku: String!
  """The name of the product as it is listed on wayfair.com"""
  name: String!
  """URL to the page of one of the product's variations on wayfair.com"""
  url: String
  """The url to an image of one of this product's variations"""
  imageUrl(size: ImageSizeInput): String
  """The product's rating from customers. Out of 5"""
  averageOverallRating: Float
  """The number of the product that must be ordered together"""
  minimumOrderQuantity: Int
  """The number of pieces included"""
  setQuantity: Int
  """The number of pieces included in the product as shown on site"""
  displaySetQuantity: Int
  """The status of the product"""
  status: String
  """More detailed information about the current status of the product"""
  statusDetail: String
  """The harmonized system code of the product (excluding the country code portion)"""
  harmonizedSystemCode: String
  """The code of the product for Canada"""
  canadaCode: String
  """The minimum height of the product"""
  minimumHeight: Dimension
  """The maximum height of the product"""
  maximumHeight: Dimension
  """The minimum width of the product"""
  minimumWidth: Dimension
  """The maximum width of the product"""
  maximumWidth: Dimension
  """The minimum depth of the product"""
  minimumDepth: Dimension
  """The maximum depth of the product"""
  maximumDepth: Dimension
  """The class of products this product belongs to"""
  class: ProductClass
  """The manufacturer that made the part"""
  manufacturer: Manufacturer
  """The collection this product is a part of"""
  collection: ProductCollection
  """The variations this product comes in"""
  options: [ProductOption!]
  """Each active option combination of this product"""
  variations: [ProductVariation!]
  """The return policy of the product"""
  returnPolicy: String!
}

"""The weight of some object"""
type Weight {
  """The amount of weight"""
  amount: Float!
  """The unit of the weight"""
  unit: WeightUnit!
}

"""An input for weight measurements"""
input WeightInput {
  """The numeric value of the weight measurement"""
  value: Float!
  """The unit in which the value is measured"""
  unit: WeightUnit!
}

"""An enumeration of the different weight units that are supported"""
enum WeightUnit {
  """Pounds (lbs)"""
  POUNDS
  """Kilograms (kg)"""
  KILOGRAMS
}

"""Allows for ordering of elements"""
input orderingInput {
  """The ascending ordering. When a param is provided the result set will be ordered in ascending order according to the param provided"""
  asc: String
  """The descending ordering. When a param is provided the result set will be ordered in descending order according to the param provided"""
  desc: String
}
