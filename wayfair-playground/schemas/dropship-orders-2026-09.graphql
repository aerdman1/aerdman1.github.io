"""Weight represented without floating-point rounding."""
type Weight {
  """Decimal magnitude, e.g. "12.5"."""
  value: String!
  """Unit the magnitude is expressed in."""
  unit: WeightUnit!
}

"""Units of measure supplier APIs publish a weight in."""
enum WeightUnit {
  LB
}

"""Storefront an order was placed through. Inferred from the playground's recorded responses."""
type SupplierDropshipOrderOrigin {
  """Display name of the storefront, e.g. Wayfair."""
  displayName: String
  """Market the storefront serves."""
  marketContext: SupplierDropshipMarketContext
}

"""Market a storefront serves. Every value in the recorded responses is a short code, e.g. brand WF, country US, locale en-US, channel ECM, segment B2C."""
type SupplierDropshipMarketContext {
  brand: String
  country: String
  locale: String
  channel: String
  segment: String
}
