# Dropship Orders API
# Rebuilt from the public reference docs at https://developer.wayfair.io/posts/docs/dropship-orders-api/reference/GraphQL/v1.0.0
# Endpoint: https://api.wayfair.io/2026-09/dropship-orders/graphql
# Not produced by introspection: verify against the live API before publishing.
# Corrected 2026-09-30 against the API Playground's own operations (fix_schemas.py):
#   scalar SupplierDropshipOrderResult -> union of 2
#   added SupplierDropshipOrder.origin (inferred)
#   added SupplierDropshipTask.requestedShipSpeed (inferred)
#   added SupplierDropshipTask.requestedShippingAddress (inferred)
#   added type SupplierDropshipOrderOrigin (inferred)
#   added type SupplierDropshipMarketContext (inferred)

type Query {
  """Dropship purchase orders for the calling supplier, cursor-paginated. Per-order failures come back as SupplierDropshipOrderIssue nodes so one unknown PO does not fail the page."""
  dropshipOrders(
    """Filters narrowing the orders returned; omit to read the supplier's orders unfiltered."""
    filter: SupplierDropshipOrderFilterInput
    """Orders per page when paging forward, 1 to 250; omit for the default of 50. Cannot be combined with last or before."""
    first: Int
    """Cursor to page forward from (pageInfo.endCursor); omit for the first page. Cannot be combined with last or before."""
    after: String
    """Orders per page when paging backward, 1 to 250. Requires before; cannot be combined with first or after."""
    last: Int
    """Cursor to page backward from (pageInfo.startCursor). Requires last; cannot be combined with first or after."""
    before: String
    """Sort order; every sort is tie-broken on PO number so cursors stay stable."""
    sort: SupplierDropshipOrderSortInput
  ): SupplierDropshipOrderConnection
}

"""ISO 3166-1 alpha-3 country code, e.g. USA."""
scalar CountryCode

"""ISO 4217 currency codes currently supported by supplier APIs."""
enum CurrencyCode {
  CAD
  EUR
  GBP
  USD
}

"""UTC date-time, RFC 3339 (e.g. 2026-08-25T14:03:11Z)."""
scalar DateTime

"""Date-time window in UTC RFC 3339; both bounds are required."""
input DateTimeIntervalInput {
  """Inclusive lower bound."""
  from: DateTime!
  """Exclusive upper bound; a record exactly at to belongs to the next window."""
  to: DateTime!
}

"""Monetary amount represented without floating-point rounding."""
type Money {
  """Decimal amount, e.g. "45.50"."""
  amount: String!
  """ISO 4217 currency the amount is denominated in."""
  currencyCode: CurrencyCode!
}

"""Cursor pagination metadata."""
type PageInfo {
  """True when another page follows this one."""
  hasNextPage: Boolean!
  """True when a page exists before this one."""
  hasPreviousPage: Boolean!
  """Opaque cursor of the first node on this page."""
  startCursor: String
  """Opaque cursor of the last node on this page; pass back as after."""
  endCursor: String
}

"""Shared postal address with contact details."""
type PostalAddress {
  """Full name of the addressee."""
  name: String
  """First address line."""
  address1: String
  """Second address line."""
  address2: String
  """Third address line."""
  address3: String
  """City. Served with the reading operation's base permission."""
  city: String
  """State or province. Served with the reading operation's base permission."""
  state: String
  """Country, ISO 3166-1 alpha-3. Served with the reading operation's base permission."""
  country: CountryCode
  """Postal or zip code."""
  postalCode: String
  """Contact phone number."""
  phoneNumber: String
  """Contact email address."""
  email: String
}

"""Sort direction."""
enum SortDirectionInput {
  ASC
  DESC
}

"""A logistics agent on the shipment route."""
type SupplierDropshipAgent {
  """Agent identifier."""
  id: ID!
  """Agent name."""
  name: String
}

"""A line item on a dropship purchase order."""
type SupplierDropshipLineItem {
  """Supplier part number."""
  supplierPartNumber: String
  """Units ordered on the line."""
  quantity: Int
  """Wholesale price per unit. Nullable, unlike the money it holds: the price is carried on the OX purchase-order line, which a partial hydration can leave absent, and a non-null price would then null the line — and with it the whole page."""
  unitPrice: Money
  """Line-item status, in the same vocabulary as the order's status: the domain resolves a line's OX status onto the supplier-facing status set, so one filter value means the same thing on an order and on a line. Null when the fulfilment record carries a state this contract has no member for, rather than a guessed member."""
  status: SupplierDropshipOrderStatus
  """Customisation text captured on the line."""
  customComment: String
  """Composite-wood emission compliance flag (CARB / TSCA Title VI). Taken from the snapshot's CARB compliance flag, then from the composite-wood lookup the page read already performs. Null when neither answers — an unknown flag, not "not compliant"."""
  isTscaCompliant: Boolean
  """Number of pieces per unit."""
  pieceCount: Int
  """Line total at the wholesale price."""
  orderValue: Money
  """Product name."""
  name: String
  """Wayfair listing identifier of the product."""
  listingId: String
  """Unit weight."""
  weight: Weight
  """Line weight: the unit weight times the ordered quantity."""
  totalWeight: Weight
  """When the line shipped: the date the carrier took the shipment (OX OpShipDate)."""
  actualShipDate: DateTime
  """When the line was delivered to the customer (OX OdCTDeliveryDate)."""
  deliveryDate: DateTime
  """Sales event the line was purchased under. No producer on this read yet."""
  event: SupplierDropshipSalesEvent
  """Line-item tasks awaiting supplier action."""
  tasks: [SupplierDropshipTask]
}

"""A dropship purchase order."""
type SupplierDropshipOrder {
  """Store-prefixed PO number, e.g. CS665334026."""
  purchaseOrderNumber: String!
  """When the purchase order was created."""
  createdAt: DateTime
  """Customer order the purchase order belongs to; opaque, compare it only for equality."""
  customerOrderId: ID
  """Market segment the order was placed under."""
  orderType: SupplierDropshipOrderType!
  """Supplier-facing status of the order."""
  status: SupplierDropshipOrderStatus!
  """When the supplier must ship the order by."""
  mustShipByDate: DateTime!
  """Customer the order was placed by; the destination is shippingAddress. Always present; its fields are null where the record carries nothing. Buyer PII: identifying fields require orders:read-dropship-orders-pii (SEC-03)."""
  customer: PostalAddress!
  """Store the order was placed on."""
  storeName: String!
  """Carrier and agent routing for the shipment."""
  shippingInfo: SupplierDropshipShippingDetails!
  """Warehouse the order ships from."""
  warehouseDetails: SupplierDropshipWarehouse
  """Where the order is billed to; the email is not published on this read. Buyer PII: identifying fields require orders:read-dropship-orders-pii (SEC-03)."""
  billingAddress: PostalAddress!
  """Where the order ships to. Always present; its fields are null where the record carries nothing. Buyer PII: identifying fields require orders:read-dropship-orders-pii (SEC-03)."""
  shippingAddress: PostalAddress!
  """Line items on the order; empty rather than null when none are published."""
  lineItems: [SupplierDropshipLineItem!]!
  """Order-level tasks awaiting supplier action."""
  tasks: [SupplierDropshipTask]
  """Storefront the order was placed through. Inferred from the playground's recorded responses."""
  origin: SupplierDropshipOrderOrigin
}

"""One cursor-paginated page of dropship purchase orders."""
type SupplierDropshipOrderConnection {
  """Nodes on this page paired with their cursors, in sort order."""
  edges: [SupplierDropshipOrderEdge]
  """Cursors and page availability for this page."""
  pageInfo: PageInfo
}

"""A node with the cursor that addresses it."""
type SupplierDropshipOrderEdge {
  """Opaque cursor for this node; pass as after to page past it. Null on issue nodes: a PO number that resolved to no order has no position in the index, so it never becomes a page boundary. Page with pageInfo.endCursor, not with an edge cursor."""
  cursor: String
  """The order, or the issue describing why it could not be returned."""
  node: SupplierDropshipOrderResult
}

"""Per-order codes this read can emit. Codes with no producer are not published (DSGN-05)."""
enum SupplierDropshipOrderErrorCode {
  """No purchase order matched the requested PO number for this supplier. Classification NOT_FOUND; not retryable — the same PO number will not resolve later."""
  NOT_FOUND
  """The order could not be resolved for a reason the caller cannot act on. Classification INTERNAL; retryable with backoff."""
  INTERNAL
}

"""Filters narrowing the dropship purchase orders returned."""
input SupplierDropshipOrderFilterInput {
  """Keeps only orders in one of these statuses. At most 9 entries, one per published status; a longer list is rejected with FILTER_CARDINALITY_EXCEEDED (FILT-08)."""
  orderStatus: [SupplierDropshipOrderStatusInput!]
  """Keeps only orders having at least one line item in one of these statuses. STAGED describes an order rather than a line item and is never published on one, so filtering line items on it is rejected with BAD_USER_INPUT rather than answered with an empty page (FILT-06). Every other member is accepted. At most 9 entries, one per published status; a longer list is rejected with FILTER_CARDINALITY_EXCEEDED (FILT-08)."""
  lineItemStatus: [SupplierDropshipOrderStatusInput!]
  """Store-prefixed PO numbers, e.g. CS665334026. Numbers with no order resolve to issue nodes. At most 100 per request; a longer list is rejected with FILTER_CARDINALITY_EXCEEDED."""
  purchaseOrderNumbers: [String!]
  """Interval the orders were created in. Optional, but when it is given both bounds are required; an interval starting more than 180 days ago, or wider than 30 days, is rejected with DATA_AVAILABILITY_WINDOW."""
  createdAt: DateTimeIntervalInput
  """Keeps only orders with at least one of these tasks raised (OR within the list; AND with the other filter fields). At most 3 entries, one per published task type; a longer list is rejected with FILTER_CARDINALITY_EXCEEDED (FILT-08)."""
  orderTasks: [SupplierDropshipOrderTaskTypeInput!]
}

"""A dropship purchase order that could not be returned; carries the Master Error Catalog triplet so the caller can branch on code, surface message and act on remediation without string-matching (ERR-01, ERR-03)."""
type SupplierDropshipOrderIssue {
  """PO number the issue belongs to: the number the caller asked for when nothing resolved, or the number of the order that could not be published. Non-null to match the order's own purchaseOrderNumber: a query selecting the field in both branches of the union is rejected outright when the two shapes differ."""
  purchaseOrderNumber: String!
  """Stable machine-readable code from the Master Error Catalog."""
  code: SupplierDropshipOrderErrorCode!
  """Human-readable description of what went wrong."""
  message: String!
  """What the caller should do about it."""
  remediation: String!
}

"""Either a resolved purchase order or the per-order issue that replaced it."""
union SupplierDropshipOrderResult = SupplierDropshipOrder | SupplierDropshipOrderIssue
"""Field an order page is sorted on."""
enum SupplierDropshipOrderSortFieldInput {
  """Date the purchase order was created."""
  CREATED_AT
}

"""Sort applied to the page."""
input SupplierDropshipOrderSortInput {
  """Field to sort on; defaults to CREATED_AT."""
  field: SupplierDropshipOrderSortFieldInput
  """Sort direction; defaults to DESC."""
  direction: SortDirectionInput
}

"""Supplier-facing status of a dropship purchase order."""
enum SupplierDropshipOrderStatus {
  """Received, not yet worked."""
  NEW
  """Being prepared by the supplier."""
  PROCESSING
  """Staged for pickup."""
  STAGED
  """Staged and awaiting carrier pickup."""
  READY_FOR_PICKUP
  """Collected from the supplier, not yet scanned by the carrier."""
  PICKED_UP_AWAITING_CARRIER_SCAN
  """Handed to the carrier and scanned by it."""
  IN_TRANSIT_CARRIER_SCAN_RECEIVED
  """Delivered to the customer."""
  DELIVERED
  """Cancelled."""
  CANCELLED
  """Returned."""
  RETURNED
}

"""Supplier-facing status of a dropship purchase order, as a filter value (FILT-05, NAME-09)."""
enum SupplierDropshipOrderStatusInput {
  """Received, not yet worked."""
  NEW
  """Being prepared by the supplier."""
  PROCESSING
  """Staged for pickup."""
  STAGED
  """Staged and awaiting carrier pickup."""
  READY_FOR_PICKUP
  """Collected from the supplier, not yet scanned by the carrier."""
  PICKED_UP_AWAITING_CARRIER_SCAN
  """Handed to the carrier and scanned by it."""
  IN_TRANSIT_CARRIER_SCAN_RECEIVED
  """Delivered to the customer."""
  DELIVERED
  """Cancelled."""
  CANCELLED
  """Returned."""
  RETURNED
}

"""A task awaiting supplier action on an order or line item."""
enum SupplierDropshipOrderTaskType {
  """Cancellation requested and awaiting supplier action."""
  PENDING_CANCELLATION
  """Ship-address change awaiting supplier action."""
  SHIP_ADDRESS_CHANGE
  """Ship-speed change awaiting supplier action."""
  SHIP_SPEED_CHANGE
}

"""A task awaiting supplier action, as a filter value (FILT-05, NAME-09)."""
enum SupplierDropshipOrderTaskTypeInput {
  """Cancellation requested and awaiting supplier action."""
  PENDING_CANCELLATION
  """Ship-address change awaiting supplier action."""
  SHIP_ADDRESS_CHANGE
  """Ship-speed change awaiting supplier action."""
  SHIP_SPEED_CHANGE
}

"""Market segment an order was placed under."""
enum SupplierDropshipOrderType {
  """Placed by a business buyer."""
  B2B
  """Placed by a consumer."""
  B2C
}

"""Sales event a line item was purchased under."""
type SupplierDropshipSalesEvent {
  """Event identifier."""
  id: ID
  """Event type."""
  type: String
  """Event name."""
  name: String
  """When the event starts."""
  startDate: DateTime
  """When the event ends."""
  endDate: DateTime
}

"""Carrier and agent routing for a shipment."""
type SupplierDropshipShippingDetails {
  """Requested ship speed. An order carrying a ship speed this contract has no member for is published as a SupplierDropshipOrderIssue rather than with a guessed speed."""
  shipSpeed: SupplierShipSpeed!
  """SCAC of the carrier the shipment is tendered to, e.g. FDEG. A string, not an enum: SCAC codes are an external registry Wayfair does not own, and the carriers a supplier can be routed to are per-supplier configuration, so no schema-wide closed set exists (NAME-05 applies to closed sets only)."""
  carrierCode: String
  """Agent operating the pool point. Null for orders the snapshot rollout does not cover yet."""
  poolPointAgent: SupplierDropshipAgent
  """Agent operating the cross dock. Null for orders the snapshot rollout does not cover yet."""
  crossDockAgent: SupplierDropshipAgent
  """Agent performing final delivery. Null for orders the snapshot rollout does not cover yet."""
  deliveryAgent: SupplierDropshipAgent
}

"""A task awaiting supplier action."""
type SupplierDropshipTask {
  """What the task is."""
  taskType: SupplierDropshipOrderTaskType
  """Where the task has got to."""
  status: SupplierDropshipTaskStatus
  """Ship speed the task asks for. Inferred: typed like shippingInfo.shipSpeed."""
  requestedShipSpeed: SupplierShipSpeed
  """Shipping address the task asks for. Inferred: typed like the order's shippingAddress."""
  requestedShippingAddress: PostalAddress
}

"""State of a task on an order or line item."""
enum SupplierDropshipTaskStatus {
  """Raised and still waiting on the supplier."""
  PENDING_SUPPLIER_REVIEW
}

"""Warehouse an order ships from."""
type SupplierDropshipWarehouse {
  """Warehouse identifier."""
  id: Int!
  """Warehouse address, from fulfillment-center configuration. Always present; its fields are null where the configuration carries nothing. Treated as PII: on a dropship order the ship-from location is frequently the supplier's own facility or a person's, so identifying fields require orders:read-dropship-orders-pii (SEC-03)."""
  address: PostalAddress!
}

