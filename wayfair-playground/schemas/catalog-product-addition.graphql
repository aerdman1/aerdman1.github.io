"""Product descriptions are shared at the group level (SKU) within Wayfair."""
input ProductDescriptionInput {
  """The set of supplier part numbers that should have the same marketing copy and feature bullet changes applied. It is important to note that descriptions are not defined at the supplier part number and instead are applied at the internal grouping (SKU) level. Therefore, the parts specified below may affect one or more groups which could affect more parts than are provided in the set. It is also important to know that parts can be included in multiple groups. Here are examples of expected behaviors: Given group SKU_1 has PART_1 and PART_2 and only PART_1 was provided then descriptions on site would also apply to PART_2. Given PART_1 belongs to both group SKU_1 and SKU_2 then updates to PART_1 would apply the description to both SKU_1 and SKU_2 on site."""
  supplierPartNumbers: [String!]!
  """The marketing copy that describes the product details. If an empty string or null value is provided then: At least three feature bullets are required for the product Any existing marketing copy will be removed"""
  marketingCopy: String
  """The feature bullets for the product in the order that should be displayed on site. If an empty list or null value is provided then: The marketing copy is required for the product Any existing feature bullets will be removed If the set of bullets is less than three then: The marketing copy is required for the product Any feature bullet that exists but is not in the set provided will be removed If the set of bullets has three or more then: Any feature bullet that exists but is not in the set provided will be removed"""
  featureBullets: [String!]
}

"""An association of partId to answered questions for the given part."""
input ProductPartWithAnswers {
  """Optional ManufacturerId that corresponds to a manufacturer brand. You can provide this instead of answering the 'core::manufacturerId' question. Note: Both ManufacturerId and ManufacturerName cannot be provided, only one of them can be provided at a time."""
  manufacturerId: ID
  """Optional ManufacturerName that corresponds to a manufacturer brand. You can provide this instead of giving an input for the ManufacturerId. Note: Both ManufacturerId and ManufacturerName cannot be provided, only one of them can be provided at a time."""
  manufacturerName: String
  """The part number that represents the supplier's product. You can provide this in place of answering the 'core::supplierPartNumber' question"""
  supplierPartNumber: String
  """An array of answers to given questions, as identified by the question's id."""
  answers: [Answer!]!
  """After the product addition request is accepted, it is submitted for validation. This validation process may result in validation flaws, which will need manual correction using our remediation mutation. Flaws can be of type ERROR or WARNING, remediation is required for the former and optional for the latter. If validation yields only flaws of type WARNING, setting this flag to "true" causes this part addition request to proceed despite warnings. Otherwise, warnings will need to be manually remediated. This flag overrides the same one set at the SubmitProductAdditionsRequest object level. If not provided, defaults to false."""
  ignoreWarnings: Boolean
  """You can provide this in place of answering the 'core::amazonStandardIdentificationNumber' question"""
  amazonStandardIdentificationNumber: String
  """You can provide this in place of answering the 'core::collectionName' question"""
  collectionName: String
  """You can provide this in place of answering the 'core::manufacturerPartNumber' question"""
  manufacturerPartNumber: String
  """You can provide this in place of answering the 'core::manufacturerProductUrl' question"""
  manufacturerProductUrl: String
  """You can provide this in place of answering the 'core::productName' question"""
  productName: String
  """You can provide this in place of answering the 'core::universalProductCode' question"""
  universalProductCode: String
  """You can provide this in place of answering the 'featureDescription::genericFeatures' question"""
  featureBullets: [String!]
  """All the media that is related to the new product being added."""
  media: MediaInput
  """You can provide this in place of answering the 'featureDescription::romanceCopy' question"""
  marketingCopy: String
}

