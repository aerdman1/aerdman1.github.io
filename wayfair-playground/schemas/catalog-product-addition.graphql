  catalogEntityProperty: CatalogEntityProperty
  """For catalog entity properties that have IDs associated with each field within the property (such as taxonomy attributes), this is used to identify which field within the property has an issue. Example (when the value provided for taxonomy attribute id: 1234 has a problem), this field will be "1234" """
