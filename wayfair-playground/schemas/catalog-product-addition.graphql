}

"""Pre-defined possible values that can be provided for a taxonomy attribute to describe a catalog entity."""
type TaxonomyAttributePossibleValue {
  """The actual value that can be provided for a taxonomy attribute to help describe a catalog entity. Example: For taxonomy attribute Pillow Type, possible values could be "Round" or "Rectangular", etc."""
  value: String!
  """Explanation of what this possible value represents"""
  definition: String
}

"""Indicates whether a taxonomy attribute is required for a catalog entity."""
enum TaxonomyAttributeRequirement {
  """The taxonomy attribute is optional."""
  OPTIONAL
  """The taxonomy attribute is required."""
  REQUIRED
  """The taxonomy attribute is not required, but recommended."""
  RECOMMENDED
}

"""Allowed data types for assigning values to taxonomy attributes."""
enum TaxonomyAttributeValueDatatype {
  """True or False"""
  BOOLEAN
  """A single word"""
  STRING
  """Integer"""
  INTEGER
  """Floating point number"""
  DECIMAL
  """Single selection only"""
  SINGLE_CHOICE
  """Multiple options can be selected"""
  MULTI_CHOICE
}

"""Information about the expected data type and structure of taxonomy attribute values"""
type TaxonomyAttributeValueFormat {
  """Indicates whether the value can be a custom value not listed under possible attribute values."""
  canValueBeCustomized: Boolean
  """Indicates whether the value can be set to Unavailable in cases where the supplier did not get this information from the manufacturer. If true, the possible values list will include "Unavailable" """
  canValueBeSetToUnavailable: Boolean
  """Indicates whether the value can be set to Does Not Apply (N/A) in cases where the attribute is not relevant. If true, the possible values list will include "Does Not Apply" """
  canValueBeSetToNotApplicable: Boolean
  """When a string value is provided for this taxonomy attribute, it will be converted to this type in our system; therefore, the provided string must be convertible to this data type (unless the selected value is "Does Not Apply" or "Unavailable")."""
  datatype: TaxonomyAttributeValueDatatype
  """Will be used when the attribute is intended to provide information about a given measurement, for example: Weight = 10 kg"""
  measurement: TaxonomyAttributeMeasurement
}

