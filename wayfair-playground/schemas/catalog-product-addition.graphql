type UpdateProductDescriptionStatusResponse {
  """The transaction ID that can be associated with the update."""
  transactionId: String!
  """The current status of the associated product update description request. During the update request, if any basic validation rules are violated, the status will initially be set to RECEIVED state or REJECTED state. From the RECEIVED state, as updates are attempted, it will transition to the PROCESSING state. If any business rules are violated, the entire update will terminate and the status will be set to REJECTED. Otherwise, from the PROCESSING state, it will transition to the final PROCESSED state, and result details will be provided in the update group response."""
  status: ProductUpdateDescriptionStatus!
  """Groups that have been updated when the request is in PROCESSED state."""
  updatedGroups: [UpdateProductDescriptionGroupResponse!]!
  """Errors encountered when the update is in REJECTED state."""
