  """The questionId, returned from the productAddition.questions query."""
  questionId: String!
  """Applicable when providing multiple answers for a multi-value question (i.e., isMultiValue == true). Set the first answer to number 1, then increment for subsequent answers. Can be used in conjunction with rank."""
  parentRank: Int
  """Applicable when providing multiple answers for a multi-choice question (i.e., QuestionAnswerType == MULTI_CHOICE). Set the first answer to number 1, then increment for subsequent answers. Can be used in conjunction with parentRank."""
  rank: Int
