type Query {
  """Query for fetching taxonomy categories by page using market context"""
  taxonomyCategories(
    marketContext: MarketContextInput!
    paginationOptions: PaginationOptions
  ): TaxonomyCategoriesResult
  """Brand associations for a supplier."""
  supplierBrand: SupplierBrandQueries
  """Product addition questions and submissions."""
  productAddition: ProductAdditionQueries
  """Media metadata."""
  media: MediaQueries
}

"""Media metadata. Reached as `query { media { … } }`."""
type MediaQueries {
  """Retrieve media meta data tags"""
  mediaMetaDataTags(
    mediaMetaDataTag: MediaMetaDataTagInput!
  ): [MediaMetaDataTagSet!]!
}

"""Product addition questions and submissions. Reached as `query { productAddition { … } }`."""
type ProductAdditionQueries {
  """Fetches product addition questions for a given combination of supplierId, marketContext, and classId. For details about each input parameter, see the documentation for the GetProductAdditionQuestionsRequest type."""
  questions(
    request: GetProductAdditionQuestionsRequest!
  ): [ProductAdditionQuestion]!
  """Fetches product additions by request ids. The output of the productAddition.submit mutation is typically the input for this query."""
  submissions(
    request: GetProductAdditionsRequest!
  ): [ProductAddition]
}

"""Brand associations for a supplier. Reached as `query { supplierBrand { … } }`."""
type SupplierBrandQueries {
  """Fetches brands associated with a given supplier and market context."""
  brandAssociations(
    request: GetSupplierBrandsAssociationsRequest
  ): GetSupplierBrandsAssociationsResponse
}

type Mutation {
  """Submit product additions."""
  productAddition: ProductAdditionMutations
}

"""Submit product additions. Reached as `mutation { productAddition { … } }`."""
type ProductAdditionMutations {
  """Initiates the product addition submission flow for a given supplierId. Up to 200 products are allowed. Proposed product additions should be grouped by marketContext and classId. For each product, answers must be provided for the questions fetched using the productAddition.questions query. For details about each input parameter, see the documentation for the SubmitProductAdditionsRequest type."""
  submit(
    request: SubmitProductAdditionsRequest!
    ProposedProductAdditionsInput: SubmitProductAdditionRequest!
  ): SubmitProductAdditionsResponse!
}

"""Encapsulates the details of a given answer to a product addition question."""
input Answer {
  """The questionId returned from the productAddition.questions query."""
  questionId: String!
  """The question answer represented as a string. It needs to conform to the data type specified by the QuestionAnswerType field in the ProductAdditionQuestion type."""
  value: String!
  """Applicable when providing multiple answers for a multi-value question (i.e., isMultiValue == true). Set the first answer to number 1, then increment for subsequent answers. Can be used in conjunction with rank. Default value = 1"""
  parentRank: Int!
  """Applicable when providing multiple answers for a multi-choice question (i.e., QuestionAnswerType == MULTI_CHOICE). Set the first answer to number 1, then increment for subsequent answers. Can be used in conjunction with parentRank. Default value = 1"""
  rank: Int!
}

