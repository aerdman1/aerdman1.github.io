  """Retrieve detailed information about a specific multichannel fulfillment order."""
  fulfillmentOrderDetails(orderDetailsInput: FulfillmentOrderDetailsInput!): FulfillmentOrderDetailsPayload
  """Retrieve a paginated list of multichannel fulfillment orders for a supplier."""
