"""Input type for pagination parameters"""
input InboundOrderPageInput {
  """REQUIRED. Maximum number of results to return."""
  limit: Int! = 10
  """REQUIRED. Number of the page."""
  offset: Int! = 0
}

"""InboundOrderResponse contains list of inbound orders"""
type InboundOrderResponse {
  """List of inbound Orders"""
  inboundOrders: [InboundOrder]
}

"""Represents inbound order shipment journey type"""
enum InboundOrderShipmentJourneyType {
  """Estimated Time of Arrival."""
  ETA
  """Actual Time of Arrival."""
  ATA
  """Estimated Time of Departure."""
  ETD
  """Actual Time of Departure."""
  ATD
  """Estimated time of arrival at Origin port."""
  ETA_ORIGIN_PORT
  """Actual Time of Arrival at Origin port."""
  ATA_ORIGIN_PORT
  """Estimated Time of Departure at Origin port."""
  ETD_ORIGIN_PORT
  """Actual Time of Departure at Origin port."""
  ATD_ORIGIN_PORT
  """Demurrage Start Date is the last free day date + 1. Example : If the last free day is 5/23, the demurrage start day is 5/24"""
  DEMURRAGE_START_DATE
  """Represents the date the HBL is telex released by the MSK origin agent"""
  BILL_OF_LADING_SURRENDERED
  """The date when customs cleared"""
  CUSTOMERS_CLEARED
  """RepresentsCustomer last feed days rather than internal last feed day last day of free storage time"""
  LAST_FREE_DAY
  """Gate out at Destination Port"""
  GATED_OUT_AT_DESTINATION_PORT
  """Container arrived rail port"""
  CONTAINER_ARRIVED_RAIL_PORT
  """Estimated time of arrival at destination warehouse."""
  DESTINATION_WAREHOUSE_ETA
  """Actual time of arrival at destination warehouse."""
  DESTINATION_WAREHOUSE_ATA
  """Empty container available for pick up"""
  EMPTY_CONTAINER_AVAILABLE_FOR_PICKUP
  """Empty container returned to port"""
  EMPTY_CONTAINER_RETUNRED_TO_PORT
}

"""Input type for sorting parameters"""
input InboundOrderSortInput {
  """Sorting based on created date, Default Sorting order is ascending on created Date"""
  createdDate: InboundOrderSortOrder
}

"""Represents sort order by Ascending or descending order"""
enum InboundOrderSortOrder {
  """Sorting Order in ascending order"""
  ASCENDING
  """Sorting Order in descending order"""
  DESCENDING
}

"""Status of InboundOrders"""
enum InboundOrderStatus {
