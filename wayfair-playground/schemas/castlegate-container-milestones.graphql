type Location {
  """Represents location name details"""
  name: String!
  """Represents location type details"""
  type: LocationType!
  """Represents order address details"""
  address: InboundOrderAddress
  """United Nations code for locations"""
  unlocode: String
  castlegateWarehouseId: Int
}

"""Represents location type details"""
enum LocationType {
  CASTLEGATE_WAREHOUSE
  THIRD_PARTY_WAREHOUSE
  PORT
  FACTORY
  CONTAINER_FREIGHT_STATION
  SEA_PORT
  RAIL_PORT
  DEDICATED_BREAKBULK_FACILITY
  UNKNOWN
}
