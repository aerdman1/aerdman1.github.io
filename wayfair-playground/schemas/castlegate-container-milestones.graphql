# CastleGate Forwarding Container Milestones Supplier API
# Rebuilt from the public reference docs at https://developer.wayfair.io/posts/docs/inbound-order-shipment-milestone/reference/GraphQL/v1.0.0
# Endpoint: https://api.wayfair.io/v1/supplier-order-api/graphql
# Not produced by introspection: verify against the live API before publishing.

type Query {
  """The CGF Milestones API provides essential shipment milestone information regarding inventory in transit to or between CastleGate fulfillment centers."""
  inboundOrderList(
    """Wayfair parent supplier identifier"""
    supplierId: Int!
    """Status of the Inbound Orders"""
    status: InboundOrderStatus!
    """Search filters, based on which fragment of dataset can be retrieved."""
    filters: InboundOrderFilterInput
    """Inbound order page information, first and cursor"""
    paginate: InboundOrderPageInput!
    """Sort options for the list of inboundOrders."""
    sorts: InboundOrderSortInput
  ): InboundOrderResponse
}

"""Represents CGF logistics service"""
enum CGFInboundOrderLogisticsService {
  """Logistics service via Ocean"""
  OCEAN
  """Represents transportation of goods by truck"""
  ORIGIN_TRUCKING
  """Represents the short-distance transport of a container from the destination port or rail terminal to a nearby warehouse, distribution center, or final delivery point."""
  DESTINATION_DRAY
  """Represents combiniation of multiple smaller shipments into one larger shipment"""
  CONSOLIDATION
  """Represents where inbound goods are received at a destination cross-dock facility and are quickly sorted and transferred directly to outbound transportation with minimal or no storage"""
  DESTINATION_X_DOCK
  """Represents the short-distance trucking of a container or shipment from the origin location to the port or rail terminal"""
  ORIGIN_DRAY
  """Represents the transportation of goods by truck from the destination"""
  DESTINATION_TRUCKING
  """Represents the entry point containter inducted in logistics network or system"""
  CG_INDUCTION
  """Service is UNKNOWN or not available"""
  UNKNOWN
}

"""Represents order shipments details"""
type CGFInboundOrderShipment {
  """Represents the shipment Id"""
  shipmentId: String!
  """Represents the receiving Id"""
  receivingIds: [String]
  """Master bill of lading - CGF and Ocean Carrier contract"""
  masterBillOfLading: String
  """House bills of lading - CGF and supplier contract"""
  houseBillOfLading: String
  """ID for equipment used to transport the goods"""
  containerNumber: String
  """Describes the size and type of the equipment"""
  containerType: InboundShipmentEquipmentSize!
  """List of shipment leg details"""
  legStops: [CGFInboundOrderShipmentLegStop!]!
  """The departure port code"""
  originPortCode: String
  """Represents the shipment or container is supposed to arrive."""
  destinationPortCode: String
  """Represents Shipment Tracking status"""
  trackingStatus: InboundShipmentTrackingStatus!
}

"""Represents inbound order shipment journey details"""
type CGFInboundOrderShipmentJourney {
  """Represents Inbound order shipment journey type"""
  type: InboundOrderShipmentJourneyType!
  """Date and time without timezone."""
  timestamp: DateTime!
}

"""Represents inbound order individual stops or points along the journey of a shipment leg"""
type CGFInboundOrderShipmentLegStop {
  """Represents shipment leg sequence"""
  sequence: Int!
  """It contains location details"""
  location: Location!
  """Represents shipment leg stop descriptor details"""
  descriptor: InboundShipmentLegStopDescriptor!
  """The ocean or road freight carrier is responsible for in the shipping of goods FBS Ocean & Dray orders will have 1 Ocean carrier and 1 Dray carrier."""
  carrier: Company
  """Represents the inbound order shipment managing party details."""
  managingParty: InboundShipmentManagingParty
  """Represents the inbound order shipment transport mode"""
  transportMode: InboundShipmentTransportMode
  """Represents the inbound order shipment leg trade type."""
  tradeType: InboundShipmentLegTradeType
  """Represents inbound order shipment leg stop milestones"""
  milestones: [CGFInboundShipmentLegStopMilestone!]!
  """Represents location Details"""
  locationName: String!
  """It's a milestone on the origin side where goods are moved to the main vessel. Could be multiple transhipment legs but there is no max. But common is 2 max) The field could be empty when non ocean"""
  shipmentJourneyPortCode: String
  """Represents inbound order shipment journey details"""
  shipmentJourney: [CGFInboundOrderShipmentJourney!]!
}

"""Represents inbound order shipment leg stop milestones"""
type CGFInboundShipmentLegStopMilestone {
  """Represents the inbound order shipment leg milestone type."""
  type: InboundShipmentLegStopMilestoneType!
  """Represents start date and end date range."""
  timestamp: DateTime!
}

"""Represents shipment company details"""
type Company {
  """Details about company name"""
  name: String!
  """Represents the shipment company type."""
  type: CompanyType!
  """Represents the location details"""
  address: InboundOrderAddress
}

"""Represents the shipment company type."""
enum CompanyType {
  OVERSEAS_AGENT
  SHIPPER
  CUSTOMER
  CONSIGNEE
  CARRIER
  UNKNOWN
}

"""A date string format"""
scalar Date

"""A date-time string formatted according to RFC 3339 section 5.6 (e.g. '2020-12-25T23:59:59Z' in UTC or '2020-12-25T18:59:59-05:00' in EST)."""
scalar DateTime

"""DatetimeFilter typically contains from and to date."""
input DatetimeFilter {
  """From date in UTC time"""
  from: DateTime
  """To date in UTC time"""
  to: DateTime
}

"""List of inbound Orders"""
type InboundOrder {
  """Represents the Wayfair Order ID ."""
  orderId: String!
  """Represents supplier Purchase order number"""
  supplierOrderNumber: String
  """Order status consists whether it is open or completed or cancelled."""
  orderStatus: InboundOrderStatus!
  """Represents Supplier’s estimate of when the Cargo is ready to be shipped."""
  estimatedCargoReadyDate: Date
  """Represents the order created date in UTC"""
  createdDate: DateTime
  """Represents the Destination warehouse name"""
  destinationName: String
  """It contains inbound order bookings"""
  bookings: [InboundOrderBooking!]!
  """Responsible party for shipping the goods from a factory"""
  shipper: Company
  """The ocean or road freight carrier is responsible for in the shipping of goods FBS Ocean & Dray orders will have 1 Ocean carrier and 1 Dray carrier."""
  carrier: Company
}

"""Represents order address details"""
type InboundOrderAddress {
