"""Represents description about shipment leg."""
enum InboundShipmentLegStopDescriptor {
  """Represents the location where the logistics provider first receives the cargo for transport"""
  PLACE_OF_RECEIPT
  """Represents the seaport or terminal where the cargo is loaded into main mode of transport"""
  PORT_OF_LOADING
  """Represents the seaport or terminal where the cargo is unloaded from the vessel at the destination."""
  PORT_OF_DISCHARGE
  """A port where cargo is transferred from one vessel or transport mode to another during its journey to the final destination."""
  TRANS_SHIPMENT_PORT
  """A rail terminal where cargo is transferred between rail and another mode of transport (like truck or ship) as part of an intermodal shipment."""
  INTERMODAL_RAIL_TERMINAL
  """The location where the shipment or shipment leg is officially ended or closed out."""
  TERMINATED_LOCATION
  """A flat-bottomed boat used to transport cargo"""
  BARGE
  """A designated location, usually a harbor or terminal, where ships dock to load or unload cargo"""
  PORT
  """Represents the place of loading and port of loading"""
  PLACE_OF_RECEIPT_AND_PORT_OF_LOADING
  """Ends of the shipment journey"""
  DESTINATION
  """Starts the shipment journey"""
  ORIGIN
  """The port or terminal where empty shipping containers are picked up by a carrier or shipper before being loaded with cargo."""
  EMPTY_PICKUP_PORT
  UNKNOWN
}

enum InboundShipmentLegStopMilestoneType {
  """Estimated Time of Arrival."""
  ETA
  """Actual Time of Arrival."""
  ATA
  """Estimated Time of Departure."""
  ETD
  """Actual time of Departure."""
  ATD
  """Represents the specific date and time when a container is physically unloaded (discharged) from the vessel at a port or terminal during a shipment leg."""
  CONTAINER_DISCHARGED_DATE
  """Represents the date and time when the shipment becomes available for the consignee or next party to physically pick it up from a facility, terminal, or warehouse."""
  AVAILABLE_FOR_PICKUP_DATE
  """Represents the first date and time when the shipment becomes available for pickup at a facility or terminal, before any changes or delays."""
  INITIAL_AVAILABLE_FOR_PICKUP_DATE
  """Represents the final day a container can be stored at a port, terminal, or depot without incurring detention or demurrage charges."""
  CONTAINER_LAST_FREE_DAY
  """Represents the originally scheduled final day a container can remain at a port, terminal, or depot without incurring detention or demurrage charges, before any extensions or changes are applied."""
  CONTAINER_INITIAL_LAST_FREE_DAY
  """Represents the date from which per diem charges start accruing for a container."""
  CONTAINER_PERDIEM_DATE
  """Represents the scheduled date and time when a shipment is planned to arrive at, or be received by, a warehouse or distribution center."""
  WAREHOUSE_APPOINTMENT_DATE
  UNKNOWN
  """Represents the event or milestone when a shipment, container, or vehicle has officially entered into a facility, such as a port terminal, warehouse, or yard."""
  IN_GATED
  """Represents the scheduled date and time when a shipment or container is planned to be picked up from a warehouse or distribution center."""
  WAREHOUSE_APPOINTMENT_PICKUP_DATE
  """Represents the scheduled date and time when a shipment, container, or vehicle is planned to arrive at and be handled by a terminal (such as a port, rail yard, or container depot)."""
  TERMINAL_APPOINTMENT_DATE
  """Represents the predicted Estimated Time of Arrival"""
  PREDICTED_ETA
  """The milestone indicating the moment when the receiving process of a shipment or cargo begins at a facility, warehouse, or terminal."""
  RECEIVING_START
  """The milestone indicating the completion of the receiving process for a shipment or cargo at a facility, warehouse, or terminal."""
  RECEIVING_END
  """The date and time when a warehouse appointment is initially requested or scheduled for receiving or delivering a shipment."""
  WAREHOUSE_APPOINTMENT_REQUESTED_DATE
  """The date and time when a warehouse appointment request has been officially confirmed and scheduled for a shipment’s arrival or pickup"""
  WAREHOUSE_APPOINTMENT_CONFIRMED_DATE
  """The date and time when the container has been completely unloaded and emptied of its cargo at a specified location"""
  CONTAINER_EMPTIED_DATE
}

"""Represents the inbound order shipment leg trade type."""
enum InboundShipmentLegTradeType {
  IMPORT
  EXPORT
  NOT_APPLICABLE
  UNKNOWN
}

"""Represents the inbound order shipment managing party details."""
enum InboundShipmentManagingParty {
  CASTLEGATE_FORWARDING
  CASTLEGATE
  THIRD_PARTY
  SUPPLIER
  UNKNOWN
}

"""Contains Shipment Tracking Status"""
enum InboundShipmentTrackingStatus {
  """Shipment has not yet started."""
  NOT_STARTED
  """The shipment has officially entered the origin facility, terminal, or yard where the shipment process begins"""
  IN_GATED_AT_ORIGIN
  """The shipment has officially left the port where it was loaded onto the vessel, starting its ocean or main leg of the journey."""
  DEPARTED_FROM_PORT_OF_LOADING
  """The shipment has physically reached and docked at the port where it will be unloaded from the vessel."""
  ARRIVED_AT_PORT_OF_DISCHARGE
  """The shipment has arrived at the designated terminal where it will be picked up by the consignee or onward carrier."""
  ARRIVED_AT_PICK_UP_TERMINAL
  """The process or milestone when cargo or containers are unloaded from a vessel, aircraft, truck, or other transport vehicle at a port, terminal, or facility."""
  DISCHARGED
  """The shipment is ready and released for physical pickup by the consignee or designated carrier at the specified location"""
  AVAILABLE_FOR_PICKUP
  """The shipment has officially exited from the pickup terminal or facility after being collected for onward transport."""
  OUT_GATED_FROM_PICKUP_TERMINAL
  """The shipment has arrived and been delivered to the designated warehouse or distribution center."""
  DELIVERED_AT_WAREHOUSE
  """An empty containe is available and ready for pickup, use, or repositioning at a specified location such as a depot, terminal, or warehouse."""
  EMPTY_AVAILABLE
  """Shipment has recorved"""
  RECOVERED
  """Shipment got terminated"""
  TERMINATED
  """Shipment got cancelled"""
  CANCELLED
  """Started from starting point"""
  STARTED
  """Details about pick up"""
  PICKED_UP
  """Represents shipment arrived at yard."""
  ARRIVED_AT_YARD
  UNKNOWN
  """Represents shipment was started"""
  RECEIVING_STARTED
  """Represents shipment was ended"""
  RECEIVING_ENDED
}

"""Represents the inbound order shipment transport mode"""
enum InboundShipmentTransportMode {
  """Represents shipment transport via ocean"""
  OCEAN
  """Represents shipment transport via rail"""
  RAIL
  """Represents a short-distance trucking service that moves shipments (often containers) between ports, rail terminals, warehouses, or distribution centers."""
  DRAY
  """Represents a flat-bottomed boat used for transporting goods on rivers, canals, and other inland waterways."""
  BARGE
  """A road vehicle used to transport goods over land, typically for short to medium distances"""
  TRUCK
  UNKNOWN
}

