type Query {
  """Retrieves Dropship purchase orders."""
  getDropshipPurchaseOrders(
    """The maximum number of results to return. If a limit is set and the result set contains more items than the limit, then a subset of the results with a count equal to limit will be returned. If no limit is set, the default is 10."""
    limit: Int32 = 10
    """Use hasResponse = false to view open purchase orders and hasResponse = true to view acknowledged purchase orders"""
    hasResponse: Boolean
    """The Purchase Order starting date period. Specifies the starting date from which to grab purchase orders"""
    fromDate: IsoDateTime
    """The list of Purchase Order numbers to return"""
    poNumbers: [String]
    """Order the result set by ascending or descending order of poDate."""
    sortOrder: SortOrder = ASC
  ): [PurchaseOrder_v2]
}

type Mutation {
  """Dropship purchase order mutations."""
  purchaseOrders: PurchaseOrderMutations
}

"""Dropship purchase order mutations. Reached as `mutation { purchaseOrders { … } }`."""
type PurchaseOrderMutations {
  """Accept some products in a purchase order."""
  accept(
    """The id of the purchase order from which you are accepting items"""
    poNumber: String!
    """The purchase order's ship speed"""
    shipSpeed: ShipSpeed!
    """The line items that are being accepted"""
    lineItems: [AcceptedLineItemInput!]!
  ): TransactionStatus!
  """Send Wayfair an Advanced Shipment Notification (ASN) that items in a purchase order have shipped. This mutation notifies Wayfair that you have shipped items, enabling us to update customer tracking information. We expect that all items listed have been physically shipped and tracking numbers are valid and active with the specified carrier."""
  shipment(
    """Information about the shipment that is being made"""
    notice: ShipNoticeInput!
  ): TransactionStatus
}

