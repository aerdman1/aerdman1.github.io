type Query {
  """Lists the catalog of events you can subscribe to. Each entry describes one version of an event type: its name, business domain, a description of when it is emitted, and the named test scenarios you can send with sendSubscriptionTestEvent to try out your endpoint before real events flow."""
  availableEventDefinitions(
    """Maximum number of event definitions to return in this page."""
    first: Int
    """Cursor of the last item of the previous page (pageInfo.endCursor); omit to start from the first page."""
    after: String
  ): EventDefinitionConnection!
  """Retrieves the details of one of your webhook subscriptions: its destination URL, current status, the events it is subscribed to (with any filters), and the signing key used to sign deliveries."""
  subscription(
    """Unique identifier of the subscription, as returned by createSubscription."""
    subscriptionId: ID!
  ): Subscription
  """Lists all webhook subscriptions belonging to your account, newest first. Use filter to narrow the list to subscriptions in a given status or subscribed to particular event types, and first/after to page through large result sets."""
  subscriptions(
    """Maximum number of subscriptions to return in this page."""
    first: Int
    """Cursor of the last item of the previous page (pageInfo.endCursor); omit to start from the first page."""
    after: String
    """Optional criteria to narrow the list by subscription status and/or event type."""
    filter: EventSubscriptionFilterInput
  ): SubscriptionConnection!
}

type Mutation {
  """Creates a new webhook subscription. You choose the HTTPS endpoint that should receive notifications, one or more event types to be notified about (each with an optional filter), and optionally a delivery rate limit."""
  createSubscription(
    """Destination, events and delivery settings of the new subscription."""
    input: CreateSubscriptionInput!
  ): CreateSubscriptionPayload!
  """Permanently removes a subscription. Deliveries stop immediately and the subscription can no longer be retrieved. This cannot be undone: to receive notifications again, create a new subscription (which will have a new signing key). To stop deliveries temporarily, use disableSubscription instead."""
  deleteSubscription(
    """The subscription to remove."""
    input: DeleteSubscriptionInput!
  ): DeleteSubscriptionPayload!
  """Temporarily stops deliveries for a subscription, for example while your endpoint is under maintenance. The subscription and its settings are kept, and its status becomes DISABLED_BY_SUPPLIER. Call enableSubscription to resume deliveries."""
  disableSubscription(
    """The subscription to pause."""
    input: DisableSubscriptionInput!
  ): DisableSubscriptionPayload!
  """Resumes deliveries for a subscription that you previously disabled. The subscription returns to the ACTIVE status and new events start being delivered again."""
  enableSubscription(
    """The subscription to re-enable."""
    input: EnableSubscriptionInput!
  ): EnableSubscriptionPayload!
  """Sends a sample notification to the subscription's endpoint so you can verify that your integration receives, authenticates and processes events correctly before real events occur. The sample has the same structure as a real event of the chosen type and is signed with the subscription's signing key."""
  sendSubscriptionTestEvent(
    """The subscription to test and the event type (and optional scenario) to send."""
    input: SendSubscriptionTestEventInput!
  ): SendSubscriptionTestEventPayload!
  """Changes which events a subscription is notified about. The list you provide becomes the complete set of subscribed events: events you omit are removed and events you add start being delivered. Use this to subscribe to a new event type, stop receiving one, or move to a different event version."""
  updateSubscriptionEvents(
    """The subscription to change and its complete new list of events."""
    input: UpdateSubscriptionEventsInput!
  ): UpdateSubscriptionEventsPayload!
  """Changes the filters applied to events a subscription is already subscribed to, without changing which events it receives. A filter lets you receive only the events that match a condition (for example, only orders for a given warehouse). Leave filter empty to remove the filter from an event."""
  updateSubscriptionFilters(
    """The subscription to change and the events whose filters should be replaced."""
    input: UpdateSubscriptionFiltersInput!
  ): UpdateSubscriptionFiltersPayload!
  """Changes the maximum number of notifications per second that will be delivered to the subscription's endpoint. Lower the limit if your endpoint cannot handle bursts of deliveries."""
  updateSubscriptionRateLimit(
    """The subscription to change and its new deliveries-per-second limit."""
    input: UpdateSubscriptionRateLimitInput!
  ): UpdateSubscriptionRateLimitPayload!
}

