  """When the key was created."""
  createdAt: DateTime!
  """When the key stops being accepted. null for the current key; set on the previous key after a rotation."""
  expiresAt: DateTime
  """After a rotation, the key being retired, for as long as it is still accepted."""
  previousKey: SigningKey
}

