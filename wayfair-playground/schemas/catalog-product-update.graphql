"""Encapsulates required and optional inputs for submitting product addition requests."""
input SubmitProductAdditionsRequest {
  """The supplierId. All proposed product additions will be associated with this supplierId."""
  supplierId: ID!
  """An array of product addition requests. A maximum of 100 products (proposedProductAdditions) are allowed."""
  proposedProductAdditions: [SubmitProductAdditionRequest!]!
  """After the product addition request is accepted, it is submitted for validation. This validation process may result in validation flaws, which will need manual correction using our remediation mutation. Flaws can be of type ERROR or WARNING, remediation is required for the former and optional for the latter. If validation yields only flaws of type WARNING, setting this flag to "true" causes ALL addition requests to proceed despite warnings. Otherwise, warnings will need to be manually remediated. This flag can also be set for each individual ProductPartWithAnswers object, which effectively overrides it at this level. If not provided, defaults to false."""
  ignoreWarnings: Boolean = false
  """If true then when one product part encounters errors the entire request will be rejected so that the issues can be corrected so that products can be sent together as a bundle. This is important so that product parts that are variants of each other can be properly grouped together and not be split apart."""
  rejectAllOnErrors: Boolean = false
}

"""Encapsulates response details for a given SubmitProductAdditionsRequest."""
type SubmitProductAdditionsResponse {
  """An array of requestIds. Store them in your system, then input them into the productAddition.submissions query for status updates or errors."""
  requestIds: [ID!]!
}

