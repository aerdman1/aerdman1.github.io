}

type UpdateProductDescriptionStatusResponse {
  """ID of the transaction that can be correlated to update."""
  transactionId: String!
  """The current status of the associated product update description request. During the update request the status will be initially set to the RECEIVED state or the REJECTED state if any basic validation rules are violated. From the RECEIVED state it will transition into the PROCESSING state as the updates are being attempted. If any business rules are violated then the entire update will terminate and the status set to REJECTED. Otherwise, from the PROCESSING state it will transition to the final state of PROCESSED and the outcome details will be provided within the updated groups response."""
  status: ProductUpdateDescriptionStatus!
  """The groups that were updated when the request is in the PROCESSED state."""
  updatedGroups: [UpdateProductDescriptionGroupResponse!]!
  """The errors that were encountered when the update is in the REJECTED state."""
  errors: [UpdateProductDescriptionError]!
}

