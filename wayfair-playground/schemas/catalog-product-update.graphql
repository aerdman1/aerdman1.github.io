"""Taxonomy Categories group similar products together that are listed for sale on Wayfair's main and specialty retail brand sites (e.g. AllModern, Birch Lane, etc.)."""
type TaxonomyCategory {
  """Identifies the taxonomy category"""
  taxonomyCategoryId: ID!
  """The name of this taxonomy category"""
  name: String
}

