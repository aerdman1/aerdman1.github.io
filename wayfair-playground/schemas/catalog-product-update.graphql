"""Encapsulates pageInfo details."""
type SupplierBrandPageInfo {
  """A hasNextPage, true if it does."""
  hasNextPage: Boolean!
  """A hasPreviousPage, true if it does."""
  hasPreviousPage: Boolean!
  """A totalPages, the number of total pages."""
  totalPages: Int!
}

"""Attributes define the properties (e.g. color, size) assigned to products in a given category (e.g. pillows). Each attribute will detail requirements for its value(s), such as whether they are required or optional, the data type it represents (e.g. string, integer), and any possible values that can be chosen from."""
type TaxonomyAttribute {
  """The ID of this attribute"""
  taxonomyAttributeId: ID!
  """The human readable name of this taxonomy attribute. Examples: Pillow Shape, Fabric Pattern, Battery Type"""
  title: String!
  """An explanation of what this attribute represents"""
  description: String
  """The market in which this attribute is relevant. Some attributes are only relevant in certain market contexts, i.e. attributes providing certifications such as California Prop 65"""
  market: MarketContext
  """Designates whether this attribute is required or not, and how important it is"""
  requirement: TaxonomyAttributeRequirement!
  """Information about the data type that is expected for this attribute's value(s)"""
  valueFormat: TaxonomyAttributeValueFormat!
  """Pre-defined possible values that can be provided for this attribute to describe the catalog entity. Notes: if the attribute's value is eligible for being set as not applicable, then "Does Not Apply" will be a value in this list. if the attribute's value is eligible for being marked as data is unavailable, then "Unavailable" will be a value in this list"""
  possibleAttributeValues: [TaxonomyAttributePossibleValue]
  """The parent attribute of this attribute"""
  parentAttributeId: String
  """Child attributes. Supports one level of nesting."""
  childAttributes: [TaxonomyAttribute]
  """The group of attributes that are related based on conditionality requirement rules. When updating a given attribute, you must also include all of the related attributes as part of the request. Example: Given a related attribute ID set of [1, 2, 3] when an update to ID 1 is requested, the existing values for 2 and 3 must also be included as part of the update."""
  relatedAttributeIds: [String!]
  """The list of categories that this taxonomy attribute is used for. A catalog entity must be in one of these categories in order for this attribute to be applied to it."""
  taxonomyCategoryIds: [ID!]!
}

"""If a taxonomy attribute is meant to provide measurement data about a catalog entity (i.e. weight, brightness, temperature, etc.) this type will be used."""
type TaxonomyAttributeMeasurement {
  """The human readable name of this measurement"""
  measurementName: MeasurementName
  """The type of unit used to represent this measurement"""
  measurementUnit: MeasurementUnit
}

"""A pre-defined possible value that can be provided for a taxonomy attribute to describe the catalog entity."""
type TaxonomyAttributePossibleValue {
  """The actual value that can be provided for a taxonomy attribute, in order to help describe a catalog entity. Example: for the taxonomy attribute Pillow Type, a possible value could be "Round", or "Rectangular", etc."""
  value: String!
  """The explanation of what this possible value represents"""
  definition: String
}

"""Expresses whether a taxonomy attribute is required for a catalog entity."""
enum TaxonomyAttributeRequirement {
  """The taxonomy attribute is optional."""
  OPTIONAL
  """The taxonomy attribute is required."""
  REQUIRED
  """The taxonomy attribute is not required but recommended."""
  RECOMMENDED
}

"""Allowable data types for assigning values for taxonomy attributes."""
enum TaxonomyAttributeValueDatatype {
  """True or False"""
  BOOLEAN
  """A word"""
  STRING
  """Whole number"""
  INTEGER
  """A float"""
  DECIMAL
  """Single select only"""
  SINGLE_CHOICE
  """Multiple choices can be selected"""
  MULTI_CHOICE
}

"""Information about the data type and structure that is expected for a taxonomy attribute's value(s)"""
type TaxonomyAttributeValueFormat {
  """Indicates if the value can be a custom value that is not listed under the possible attribute value list."""
  canValueBeCustomized: Boolean
  """Indicates whether the value can be set to Unavailable, in the case that supplier does not have this information from the manufacturer. If true, the possible values list will contain "Unavailable" """
  canValueBeSetToUnavailable: Boolean
  """Indicates whether the value can be set to Does Not Apply (N/A), in the case that the attribute is irrelevant. If true, the possible values list will contain "Does Not Apply" """
  canValueBeSetToNotApplicable: Boolean
  """When a value is provided for this taxonomy attribute as a string, it will be converted to this type in our system; therefore, the string provided must be able to be cast into this data type (unless the value chosen is "Does Not Apply" or "Unavailable")."""
  datatype: TaxonomyAttributeValueDatatype
  """Will be used when the attribute is meant to provide information on a given measurement, for example: Weight = 10 kg"""
  measurement: TaxonomyAttributeMeasurement
}

"""Represents a page of taxonomy categories"""
type TaxonomyCategoriesResult {
  """The meta information about pagination"""
  pageInfo: PaginationInfo
  """The list of taxonomy categories being returned"""
