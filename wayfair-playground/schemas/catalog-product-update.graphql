"""A problem that arose from an attempt to update a catalog item or item group"""
type CatalogEntityUpdateProblem {
  """This is comparable to the problem "type" field in the problem detail spec Example: INVALID_INPUT"""
  code: String
  """This indicates the reason the problem occurred. It is a short human readable summary of the problem type Example: "Special characters such as !,@,#,$,% are not allowed" """
  title: String
  """A human readable explanation specific to this occurrence of the problem Example: "Provided input contains special characters @ and !" """
  detail: String
  """Entity identifier i.e. catalog item or item group ID Example:"""
  catalogEntityIdentifier: String
  """The property on the catalog entity that resulted in a problem Example: ITEM_NAME"""
  catalogEntityProperty: CatalogEntityProperty
  """For catalog entity properties (such as taxonomy attributes) that have IDs associated for each field within the property, this is used to identify which field within the property had the problem Example (for the case when the value provided for taxonomy attribute id: 1234 has a problem) this field will be “1234”"""
  catalogEntityPropertyId: String
  """The original input value that had the failure, represented as a string Example: "Cl@rendon Sofa!" """
  inputValue: String
}

"""Used to describe whether the request to update catalog items or items groups is finished or not."""
enum CatalogEntityUpdateStatus {
  """The update request is still being worked on"""
  IN_PROGRESS
  """The update request has finished. NOTE: COMPLETED does not necessarily mean all was successful; please see the Problems and SuccessfulUpdates fields"""
  COMPLETED
  """Update request is blocked"""
  BLOCKED
}

