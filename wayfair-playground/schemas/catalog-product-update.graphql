  locale: String
  """A unique country code ISO 3166-1 alpha-2 (https://www.iban.com/country-codes) that is used to represent a market of Wayfair. Examples: US (United States), GB (United Kingdom)"""
  country: String
  """Wayfair Family of Brands is an intangible marketing or business concept that helps people identify a company or product. Examples: WF (Wayfair), JM (Joss & Main), PG (Perigold), AM (AllModern), BL (Birch Lane)"""
  brand: String
}

