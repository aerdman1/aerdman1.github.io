  catalogItemGroupsToUpdate: [UpdateCatalogItemGroupInput!]!
  """When set to true, validate the input changes but don't actually do the update itself. When false, the validations will still be run, and for any that succeed, the update will be performed."""
  validateOnly: Boolean!
