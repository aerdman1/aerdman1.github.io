type Query {
  """Query for taxonomy attributes of a specific taxonomy category, in a given market"""
  attributesByFilter(
    """Provide a taxonomy category ID and market context to fetch the taxonomy attributes for"""
    input: AttributesFilterInput!
  ): [AttributesByFilterResult!]!
  """Query for status of any update request"""
  statusOfUpdateRequest(
    """Input required to fetch a unique update request's status"""
    input: StatusOfUpdateRequestInput!
  ): UpdateRequestStatus!
}

type Mutation {
  """Catalog update mutations."""
  updateCatalogEntitiesMutations: UpdateCatalogEntitiesMutations
}

"""Catalog update mutations. Reached as `mutation { updateCatalogEntitiesMutations { … } }`."""
type UpdateCatalogEntitiesMutations {
  """Manage media uploads and deletions for catalog items. This mutation supports two actions:"""
  updateCatalogItemsMedia(
    """The input required to update media of catalog items."""
    input: UpdateCatalogItemsMediaInput!
  ): UpdateCatalogEntityResponse!
  """Mutation for updating market-specific catalog item groups."""
  updateMarketSpecificCatalogItemGroups(
    """The input required to update market-specific catalog item groups."""
    input: UpdateMarketSpecificCatalogItemGroupsInput!
  ): UpdateCatalogEntityResponse!
  """Mutation for updating market-specific catalog items."""
  updateMarketSpecificCatalogItems(
    """The input required to update market-specific catalog items."""
    input: UpdateMarketSpecificCatalogItemsInput!
  ): UpdateCatalogEntityResponse!
}

"""Encapsulates details for a given answer to a product addition question."""
input Answer {
  """The questionId, as returned from the productAddition.questions query."""
  questionId: String!
  """The answer to the question, as represented by a string. It needs to conform to the data type, as specified by the QuestionAnswerType field in ProductAdditionQuestion type."""
  value: String!
  """Applies when providing more than one answer to a multi-valued question (i.e. isMultiValue == true). Set the first answer to the question with the number 1, then increment it for subsequent questions. Can be combined with rank."""
  parentRank: Int! = 1
  """Applies when providing more than one answer to a multi-choice question (i.e. QuestionAnswerType == MULTI_CHOICE). Set the first answer to the question with the number 1, then increment it for subsequent questions. Can be combined with parentRank."""
  rank: Int! = 1
}

