input UpdateCatalogItemMediaInput {
  """The supplier part number identifying the catalog item."""
  supplierPartNumber: String!
  """The public URL where the media is accessible. Required for UPLOAD action. Optional for DELETE action (not used when deleting media). This is used for uploading new media and for identifying existing media that should have the operation applied."""
  mediaUrl: Url
  """The type of media."""
  mediaType: MediaType!
  """The action to perform on the media. Defaults to UPLOAD if not specified. Valid values: UPLOAD: Creates a new media association or refreshes an existing one (default behavior). Requires mediaUrl. DELETE: Removes the association between a media asset and the catalog item. Requires either assetId or legacyAssetId."""
  action: MediaAction
  """The asset ID of the existing media association. Required for DELETE action (either assetId or legacyAssetId must be provided). Optional for UPLOAD action. If both assetId and legacyAssetId are provided for DELETE, assetId takes precedence."""
  assetId: String
  """The legacy asset ID of the existing media association. Required for DELETE action if assetId is not provided. Optional for UPLOAD action. Use this field when the media is identified by a legacy numeric asset ID instead of the modern string-based assetId."""
  legacyAssetId: Int
  """Optional for media image types that already exist and meet lead image eligibility criteria. If this field is set to true for a new image that is not in our systems, the override will be ignored. If the image is already in our systems and has met the lead eligibility requirements, setting this to true will override the default behavior of how Wayfair selects the lead image to display, forcing this image to always be the displayed lead image. If this is set to false, any previous override will be removed, and the lead image selection will revert to Wayfair's default lead image selection behavior."""
  leadImageOverride: Boolean
}

