  """If true, it means the update didn't happen; the input was merely validated, and that the allSucceeded is referring to validation success."""
  validationOnly: Boolean!
  """The status for the catalog item groups being requested"""
  status: CatalogEntityUpdateStatus!
  """Any handled errors that occurred during this update will be listed here. Note there could be multiple problems associated with a single catalog entity Will be empty if all was successful."""
  problems: [CatalogEntityUpdateProblem!]!
