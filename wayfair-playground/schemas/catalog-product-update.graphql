  """A locale comprises the language, territory, and code set combination used to identify a set of language conventions. It is Represented by a code with the “ll-CC” format, where “ll” is represented by ISO 639-1 (https://en.wikipedia.org/wiki/ISO_639-1) and “CC” is represented by ISO 3166-1 alpha-2 (https://www.iban.com/country-codes). Examples: en-US, en-GB, fr-CA, etc."""
